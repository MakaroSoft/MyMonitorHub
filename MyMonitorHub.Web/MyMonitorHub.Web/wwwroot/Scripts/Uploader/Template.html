<div class="ms-uploadModal modal fade" role="dialog">
    <div class="modal-dialog">

        <!-- Modal content-->
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h4 class="modal-title">File Upload</h4>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- The fileinput-button span is used to style the file input field as button -->
                        <span class="btn btn-default fileinput-button">
                            <i class="glyphicon glyphicon-plus"></i>
                            <span>Select file</span>
                            <input class="ms-fileUpload" type="file" name="files[]">
                        </span>
                        <button class="ms-startUpload btn btn-default">
                            <i class="glyphicon glyphicon-upload"></i>
                            <span>Start upload</span>
                        </button>
                        <button class="ms-cancelUpload btn btn-default">
                            <i class="glyphicon glyphicon-ban-circle"></i>
                            <span>Cancel upload</span>
                        </button>
                    </div>
                </div>

                <div class="row" style="margin-top: 20px;">
                    <div class="col-lg-12">
                        <div class="progress" style="margin-bottom: 0">
                            <div class="ms-progressBar progress progress-bar progress-bar-success"></div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="ms-infoBar col-lg-12">&nbsp;</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
            </div>
        </div>

    </div>
</div>
